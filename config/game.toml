# argument locations in API order for functions a link time code generated library compiled with another
# convention: a register (eax ebx ecx edx esi edi ebp) or "stack" for the next stack slot, which the callee pops
[abi]

# tools/movie_sweep.py: logs each movie and, with BB_DEV_MOVIE, swaps the first one (src/game/movie_probe.cpp)
[[hook]]
at = 0x23E398  # the movie player has accepted the open, its path two slots above the saved esi
call = "MovieProbeOpen"

[[hook]]
at = 0x23E1E5  # the player's whole state was just cleared
call = "MovieProbeClose"

# hold a button to skip a video: src/game/movie_probe.cpp
[[hook]]
at = 0xE1972  # XMoviePlayer::Update is about to read whether the video has finished
call = "MovieSkipCheck"

# the game's widescreen option follows the picture's shape: see KeepWidescreenOption in src/game/hooks.cpp
[[hook]]
at = 0x1A8410  # the engine's frame function, on the title's thread
call = "KeepWidescreenOption"

# the frame rate the game asks for in play: see PlayFrameRateChosen in src/game/hooks.cpp
[[hook]]
at = 0xAC71C
call = "PlayFrameRateChosen"

